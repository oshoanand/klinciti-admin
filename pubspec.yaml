name: klinciti_admin
description: "A modern, fast, and smooth admin panel."
publish_to: 'none' # Prevents accidental publishing to pub.dev
version: 1.0.0+1

environment:
  # Matches your requested Dart SDK version requirement
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==========================================
  # STATE MANAGEMENT (Zustand / React Query Equivalent)
  # ==========================================
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ==========================================
  # ROUTING & NAVIGATION (Next.js App Router Equivalent)
  # ==========================================
  go_router: ^13.2.0  

  # ==========================================
  # NETWORKING & WEBSOCKETS (Axios + Socket.io Equivalent)
  # ==========================================
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # ==========================================
  # PUSH NOTIFICATIONS & FIREBASE
  # ==========================================
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15
  flutter_local_notifications: ^17.1.0

  # ==========================================
  # STORAGE & PERSISTENCE
  # ==========================================
  # For saving JWT access tokens securely
  flutter_secure_storage: ^9.0.0
  # For saving non-sensitive flags like "has_seen_onboarding"
  shared_preferences: ^2.2.2

  # ==========================================
  # MEDIA & FILES (Image Uploading & Compression)
  # ==========================================
  image_picker: ^1.0.7
  # Equivalent to browser-image-compression (maxSizeMB: 1)
  
  flutter_image_compress: ^2.3.0
  # Efficiently loads and caches Network Images (Cloud/MinIO URLs)
  cached_network_image: ^3.4.0

  # ==========================================
  # UTILITIES & UI HELPERS
  # ==========================================
  
  intl: ^0.20.3          # For date-fns equivalent (e.g., ru locale formatting)
  uuid: ^4.3.3           # For generating temp IDs (temp-12345)
  equatable: ^2.0.5      # For efficient state comparisons
  shimmer: ^4.0.0        # For loading skeleton animations (better than just spinners)
  url_launcher: ^6.2.6   # To open external links if needed
  flutter_lucide: ^1.52.0   # To match your Lucide React icons exactly!
  path_provider: ^2.1.6
  path: ^1.9.1
  overlay_support: ^2.1.0
  flutter_ringtone_player: ^4.0.0+4
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # ==========================================
  # CODE GENERATION (For Riverpod & Freezed)
  # ==========================================
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # Enable this to load local assets like your notification sound or placeholder images
  assets:
    - assets/images/
    - assets/sounds/notification.wav # Matches your web /sounds/notification.wav

  # If you are using custom fonts to match your web app's typography
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-Black.ttf
  #         weight: 900