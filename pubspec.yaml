name: klinciti_admin
description: "A modern, fast, and smooth admin panel for klinciti"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5 # Remove if not using @riverpod codegen

  # Routing
  go_router: ^13.2.0  

  # Networking & WebSockets
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # Push Notifications & Firebase
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^17.1.0

  # Storage & Persistence
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.2.2

  # Media & Files
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.0

  # Utilities & UI Helpers
  intl: ^0.20.3
  uuid: ^4.3.3
  equatable: ^2.0.5
  shimmer: ^4.0.0
  url_launcher: ^6.2.6
  flutter_lucide: ^1.81.0
  path_provider: ^2.1.6
  path: ^1.9.1
  overlay_support: ^2.1.0 # Remove if unused
  flutter_ringtone_player: ^4.0.0+4 # Remove if local notification channels cover sounds
  smart_auth: ^4.0.0 # Remove if SMS Retriever autofill is unused
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^3.0.0

  # Remove both if not using @riverpod codegen
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/notification.wav # Replace with .ogg/.mp3 to save APK space